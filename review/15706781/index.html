<title>Before Applying Questions — Shot Review</title>
<style id="head-styles">@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

:root {
  --bg: #f2f3f6; --surface: #ffffff; --surface-sunken: #eceef2; --ink: #1e2430;
  --ink-soft: #4b5266; --muted: #767e91; --border: #dfe2e9; --accent: #c2185b;
  --pass: #1a7a4c; --pass-soft: #e4f5ec; --fail: #b3261e; --fail-soft: #fbe9e7;
  --pending: #8a6d00; --pending-soft: #fbf3d9; --shadow: rgba(30, 36, 48, 0.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a22; --surface: #1e2430; --surface-sunken: #191d26; --ink: #eceff4;
    --ink-soft: #b7bdcc; --muted: #8b91a3; --border: #2d3444; --accent: #ec5c8d;
    --pass: #4fd08c; --pass-soft: #16281f; --fail: #ff6b61; --fail-soft: #2c1815;
    --pending: #e0c04a; --pending-soft: #2c2611; --shadow: rgba(0, 0, 0, 0.45);
  }
}
:root[data-theme="dark"] {
  --bg: #161a22; --surface: #1e2430; --surface-sunken: #191d26; --ink: #eceff4;
  --ink-soft: #b7bdcc; --muted: #8b91a3; --border: #2d3444; --accent: #ec5c8d;
  --pass: #4fd08c; --pass-soft: #16281f; --fail: #ff6b61; --fail-soft: #2c1815;
  --pending: #e0c04a; --pending-soft: #2c2611; --shadow: rgba(0, 0, 0, 0.45);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); }
body { color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; line-height: 1.5; }
a { color: var(--accent); }
.masthead {
  /* Not sticky (2026-08-31, Milan) - a per-article page has no persistent control (like
     the hub's Filters button) worth keeping pinned, and a sticky header scales with browser
     zoom same as everything else, so it eats a growing, PERSISTENT share of the viewport for
     the whole time someone's zoomed in comparing shots closely - the exact complaint. Scrolls
     away normally now, same as any other page content, so its cost is paid once, not per-scroll. */
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 20px clamp(20px, 5vw, 56px); display: flex; align-items: baseline; justify-content: space-between; gap: 24px; flex-wrap: wrap;
}
.masthead-left { display: flex; flex-direction: column; gap: 6px; }
.masthead h1 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 1.5rem; margin: 0; text-wrap: balance; }
.hub-back { font-size: 0.78rem; color: var(--muted); text-decoration: none; }
.hub-back:hover { color: var(--accent); }
.hc-link { font-size: 0.78rem; color: var(--accent); text-decoration: none; }
.hc-link:hover { text-decoration: underline; }
.masthead-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.stats { display: flex; gap: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
.stat b { font-size: 0.95rem; }
.stat-pass { color: var(--pass); } .stat-fail { color: var(--fail); } .stat-pending { color: var(--muted); }
.stat-neutral { color: var(--ink-soft); }
.reviewer-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--ink-soft); }
.reviewer-row input {
  font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 0.82rem; color: var(--ink);
  background: var(--surface-sunken); border: 1.5px solid var(--border); border-radius: 6px; padding: 4px 8px; width: 150px;
}
.reviewer-row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.sync-status, .save-status { font-size: 0.72rem; color: var(--muted); font-family: 'IBM Plex Mono', monospace; max-width: 320px; text-align: right; }
.save-status-error { color: var(--fail); font-weight: 600; }
main { max-width: 1180px; margin: 0 auto; padding: 8px clamp(16px, 5vw, 56px) 80px; }
.intro { color: var(--ink-soft); max-width: 72ch; margin: 28px 0 32px; font-size: 0.95rem; }
.cards { display: flex; flex-direction: column; gap: 28px; }
.pair { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px 20px; box-shadow: 0 1px 2px var(--shadow); }
.pair-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
.pair-head-left { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.shot-num { font-size: 0.85rem; color: var(--ink-soft); font-weight: 500; }
.shot-id { font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--muted); background: var(--surface-sunken); padding: 2px 8px; border-radius: 5px; }
.status { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 10px; border-radius: 100px; white-space: nowrap; }
.status-pass { background: var(--pass-soft); color: var(--pass); }
.status-fail { background: var(--fail-soft); color: var(--fail); }
.status-pending { background: var(--surface-sunken); color: var(--muted); }
.status-awaiting { background: var(--pending-soft); color: var(--pending); }
.status-frozen { background: var(--surface-sunken); color: var(--muted); }
.status-blocked { background: var(--fail-soft); color: var(--fail); }
.frames { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.frame { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.frame-label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.frame-label span { font-weight: 400; text-transform: none; letter-spacing: 0; opacity: 0.75; }
.frame-old .frame-label { color: var(--muted); }
.frame-new .frame-label { color: var(--accent); }
.imgwrap { border: 1px solid var(--border); border-radius: 6px; overflow: auto; background: var(--surface-sunken); max-height: 560px; }
.imgwrap img { display: block; width: 100%; height: auto; }
.caption { margin: 14px 0 0; font-size: 0.87rem; color: var(--ink-soft); max-width: 84ch; }
.verdict-row { display: flex; gap: 10px; margin-top: 16px; }
.vbtn {
  font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 0.85rem; font-weight: 600;
  padding: 8px 18px; border-radius: 8px; cursor: pointer; border: 1.5px solid var(--border);
  background: var(--surface-sunken); color: var(--ink-soft); transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.vbtn:hover { border-color: var(--muted); }
.vbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vbtn-pass.active { background: var(--pass-soft); border-color: var(--pass); color: var(--pass); }
.vbtn-fail.active { background: var(--fail-soft); border-color: var(--fail); color: var(--fail); }
.imgwrap.awaiting { display: flex; align-items: center; justify-content: center; min-height: 120px; }
.awaiting-msg { color: var(--pending); font-size: 0.85rem; font-weight: 600; padding: 20px; text-align: center; }
.notes-row { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.notes-label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.notes-input {
  font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 0.85rem; color: var(--ink);
  background: var(--surface-sunken); border: 1.5px solid var(--border); border-radius: 8px;
  padding: 10px 12px; min-height: 56px; resize: vertical; line-height: 1.4;
}
.notes-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.notes-input::placeholder { color: var(--muted); }
.nothing-yet { margin: 16px 0 0; font-size: 0.82rem; color: var(--muted); font-style: italic; }
.other-reviews { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); display: flex; flex-direction: column; gap: 6px; }
.other-reviews-label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.other-review-row { font-size: 0.82rem; color: var(--ink-soft); display: block; }
.other-review-note { color: var(--muted); font-style: italic; }
.chip { font-size: 0.7rem; font-weight: 600; padding: 2px 9px; border-radius: 100px; white-space: nowrap; }
.chip-pass { background: var(--pass-soft); color: var(--pass); }
.chip-fail { background: var(--fail-soft); color: var(--fail); }
.chip-pending { background: var(--surface-sunken); color: var(--muted); }
@media (max-width: 720px) { .frames { grid-template-columns: 1fr; } }
</style>

<script id="render-script">// Client-side runtime for the STATIC (GitHub Pages) per-article shot-review
// page. Sibling of review-doc-client.js (the claude.ai Artifact version) —
// same card layout/shot data, but state lives in the Sheet behind
// review-sync.gs instead of the page republishing itself via the `artifact`
// capability (GitHub Pages has no such capability, and doesn't need one:
// nothing here is secret, see review-sync.gs's own header comment).
//
// Verdicts/notes are NOT embedded at build time — they're fetched fresh from
// the sync endpoint on every page load (`?mode=rows`), so a rebuild of this
// page can never go stale relative to what reviewers have already recorded,
// and a reviewer never needs to wait for a rebuild to see a teammate's vote.
(function () {
  var shots = JSON.parse(document.getElementById('data-shots').textContent);
  var meta = JSON.parse(document.getElementById('data-meta').textContent);
  var SYNC_ENDPOINT = meta.syncEndpoint;
  var REVIEWER_KEY = 'hc_review_reviewer_name';

  // rowsByShot: shotId -> array of {reviewer, verdict, note, updated_at}, every
  // real (non-placeholder) row currently in the Sheet for THIS article. null
  // until the fetch resolves; stays null if the fetch fails or the deployed
  // endpoint is still the old pre-doGet version (see syncAvailable below).
  var rowsByShot = null;
  var syncAvailable = false;
  var syncError = null;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function getReviewerName() {
    try { return (localStorage.getItem(REVIEWER_KEY) || '').trim(); } catch (e) { return ''; }
  }
  function setReviewerName(v) {
    try { localStorage.setItem(REVIEWER_KEY, v.trim()); } catch (e) { /* ignore */ }
  }

  function myRow(shotId) {
    var name = getReviewerName();
    if (!name || !rowsByShot || !rowsByShot[shotId]) return null;
    var found = null;
    rowsByShot[shotId].forEach(function (r) { if (r.reviewer === name) found = r; });
    return found;
  }

  function otherRows(shotId) {
    var name = getReviewerName();
    if (!rowsByShot || !rowsByShot[shotId]) return [];
    return rowsByShot[shotId].filter(function (r) { return r.reviewer !== name; });
  }

  // "Old UI" (no new_ capture yet) is a different fact from "unreviewed" -
  // same distinction review-doc-client.js draws. Pass/fail/neutral only run
  // over shots that HAVE a new_ capture.
  function statCounts() {
    var pass = 0, fail = 0, neutral = 0, newCount = 0;
    shots.forEach(function (s) {
      if (!s.new_) return;
      newCount++;
      var mine = myRow(s.id);
      var v = mine ? mine.verdict : null;
      if (v === 'pass') pass++; else if (v === 'fail') fail++; else neutral++;
    });
    return { pass: pass, fail: fail, neutral: neutral, newCount: newCount, oldCount: shots.length - newCount };
  }

  // Why a shot has no "new" capture is a different fact from IF it's due -
  // showing "Not captured yet" for a shot that's frozen, not-a-screenshot, or
  // blocked on a team dependency reads as an open gap when it isn't one.
  function notCapturedReason(s) {
    if (s.blockedForTeam) return 'Blocked — team needed' + (s.blockedReason ? ': ' + s.blockedReason : '');
    if (s.notAScreenshot) return 'Not a screenshot — not real product UI';
    if (s.doNotRecapture) {
      // 'Frozen' implies a real existing image is just being left alone -
      // true for a genuine recapture-freeze, false for a shot that was only
      // ever PROPOSED (no legacy image either) and then declined. Conflating
      // the two reads as self-contradictory: one column saying "new addition"
      // while the other says "live image confirmed current" when no image
      // ever existed on either side. See B131/B132 in OPEN-THREADS.md.
      return s.legacy
        ? 'Frozen — live image confirmed current, not being recaptured'
        : 'Declined — proposed as a new addition, decided not needed (see note)';
    }
    if (s.dueForCapture === false) return 'Not due this round';
    return 'Not captured yet';
  }

  // Short form for the header pill — the full reason (incl. blockedReason,
  // which can run long) goes in the image placeholder via notCapturedReason.
  function notCapturedLabel(s) {
    if (s.blockedForTeam) return 'Blocked';
    if (s.notAScreenshot) return 'Not a screenshot';
    if (s.doNotRecapture) return s.legacy ? 'Frozen' : 'Declined';
    if (s.dueForCapture === false) return 'Not due';
    return 'Awaiting capture';
  }

  function newFrame(s) {
    if (s.new_) {
      return '<div class="imgwrap"><img src="' + esc(s.new_) + '" alt="' + esc(s.id) + ' current" loading="lazy"></div>';
    }
    return '<div class="imgwrap awaiting"><div class="awaiting-msg">' + esc(notCapturedReason(s)) + '</div></div>';
  }

  function oldFrame(s) {
    if (s.legacy) {
      return '<div class="imgwrap"><img src="' + esc(s.legacy) + '" alt="' + esc(s.id) + ' legacy" loading="lazy"></div>';
    }
    // Same doNotRecapture check as notCapturedReason() - a shot proposed and
    // then declined never gets a legacy image either, so saying "this is a
    // new addition" here (which implies it's still coming) would contradict
    // the AFTER column's own "Declined" message right next to it.
    var msg = s.doNotRecapture
      ? 'No legacy image — this was proposed as a new addition, then declined. See the AFTER column.'
      : 'No legacy image - this is a new addition, not a recapture.';
    return '<div class="imgwrap awaiting"><div class="awaiting-msg">' + esc(msg) + '</div></div>';
  }

  function otherReviewsHtml(s) {
    var others = otherRows(s.id);
    if (!others.length) return '';
    return '<div class="other-reviews"><span class="other-reviews-label">Other reviewers</span>' +
      others.map(function (r) {
        var cls = r.verdict === 'pass' ? 'chip-pass' : r.verdict === 'fail' ? 'chip-fail' : 'chip-pending';
        var label = r.verdict === 'pass' ? 'Pass' : r.verdict === 'fail' ? 'Fail' : 'no verdict';
        return '<span class="other-review-row"><b>' + esc(r.reviewer) + '</b> <span class="chip ' + cls + '">' + label + '</span>' +
          (r.note ? ' <span class="other-review-note">' + esc(r.note) + '</span>' : '') + '</span>';
      }).join('') + '</div>';
  }

  function shotCard(s, idx) {
    var mine = myRow(s.id);
    var v = mine ? mine.verdict : null;
    var n = mine ? (mine.note || '') : '';
    var notCapturedClass = s.blockedForTeam ? 'status-blocked' : (s.notAScreenshot || s.doNotRecapture) ? 'status-frozen' : 'status-awaiting';
    var statusClass = !s.new_ ? notCapturedClass : v === 'pass' ? 'status-pass' : v === 'fail' ? 'status-fail' : 'status-pending';
    var statusLabel = !s.new_ ? notCapturedLabel(s) : v === 'pass' ? 'Pass (you)' : v === 'fail' ? 'Fail (you)' : 'Unreviewed';
    return (
      '<article class="pair" id="shot-' + esc(s.id) + '">' +
        '<header class="pair-head">' +
          '<div class="pair-head-left">' +
            '<span class="shot-num">Shot #' + (idx + 1) + ' in ' + esc(meta.articleTitle) + '</span>' +
            '<code class="shot-id">' + esc(s.id) + '</code>' +
          '</div>' +
          '<span class="status ' + statusClass + '">' + statusLabel + '</span>' +
        '</header>' +
        '<div class="frames">' +
          '<figure class="frame frame-old">' +
            '<div class="frame-label">Before <span>legacy</span></div>' +
            oldFrame(s) +
          '</figure>' +
          '<figure class="frame frame-new">' +
            '<div class="frame-label">After <span>current</span></div>' +
            newFrame(s) +
          '</figure>' +
        '</div>' +
        (s.caption ? '<p class="caption">' + esc(s.caption) + '</p>' : '') +
        (s.new_ ?
          '<div class="verdict-row">' +
            '<button type="button" class="vbtn vbtn-pass' + (v === 'pass' ? ' active' : '') + '" data-id="' + esc(s.id) + '" data-val="pass">Pass</button>' +
            '<button type="button" class="vbtn vbtn-fail' + (v === 'fail' ? ' active' : '') + '" data-id="' + esc(s.id) + '" data-val="fail">Fail</button>' +
          '</div>'
          : '<p class="nothing-yet">Nothing to review yet - no new capture.</p>') +
        (s.new_ ?
          '<div class="notes-row">' +
            '<label class="notes-label" for="notes-' + esc(s.id) + '">Your notes</label>' +
            '<textarea class="notes-input" id="notes-' + esc(s.id) + '" data-id="' + esc(s.id) + '" placeholder="Add a note - saved when you click away">' + esc(n) + '</textarea>' +
          '</div>' : '') +
        otherReviewsHtml(s) +
      '</article>'
    );
  }

  function render() {
    var counts = statCounts();
    document.getElementById('stats').innerHTML =
      '<span class="stat stat-neutral"><b>' + counts.newCount + '</b> new UI</span>' +
      '<span class="stat stat-neutral"><b>' + counts.oldCount + '</b> old UI</span>' +
      '<span class="stat stat-pass"><b>' + counts.pass + '</b> pass (you)</span>' +
      '<span class="stat stat-fail"><b>' + counts.fail + '</b> fail (you)</span>' +
      '<span class="stat stat-pending"><b>' + counts.neutral + '</b> unreviewed (you)</span>';
    document.getElementById('cards').innerHTML = shots.map(shotCard).join('\n');
    Array.prototype.forEach.call(document.querySelectorAll('.vbtn'), function (btn) {
      btn.addEventListener('click', function () {
        setVerdict(btn.getAttribute('data-id'), btn.getAttribute('data-val'));
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.notes-input'), function (ta) {
      ta.addEventListener('blur', function () {
        setNote(ta.getAttribute('data-id'), ta.value);
      });
    });
  }

  function setSyncStatus(text, isError) {
    var el = document.getElementById('sync-status');
    if (!el) return;
    el.textContent = text;
    el.classList.toggle('save-status-error', !!isError);
  }

  // 2026-08-31: a reviewer who never noticed the "Reviewing as" box (top-right,
  // position:static, scrolls out of view past shot #1) got a fully silent
  // no-op on every Pass/Fail click - the error text landed in that same
  // off-screen corner, so nothing ever posted and nothing ever looked wrong.
  // A blocking prompt() can't be missed regardless of scroll position, and it
  // only fires once per browser since the name then persists to localStorage.
  function ensureReviewerName() {
    var name = getReviewerName();
    if (name) return name;
    name = (window.prompt('Enter your name to record this (saved on this device, asked once):') || '').trim();
    if (!name) {
      setSyncStatus('Enter your name to save this', true);
      return null;
    }
    setReviewerName(name);
    var input = document.getElementById('reviewer-name');
    if (input) input.value = name;
    return name;
  }

  // Apps Script Web Apps do not answer CORS preflight (OPTIONS) requests
  // correctly, so any fetch() whose browser-set Content-Type would trigger a
  // preflight (e.g. 'application/json') silently fails cross-origin. Posting
  // as 'text/plain' keeps this a CORS "simple request" - doPost() still gets
  // the raw JSON text via e.postData.contents and JSON.parse()s it exactly
  // the same either way, so nothing server-side needs to change for this.
  function postRows(rows) {
    return fetch(SYNC_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(rows),
    }).then(function (r) { return r.json(); });
  }

  function upsertLocalRow(shotId, patch) {
    var name = getReviewerName();
    if (!rowsByShot) rowsByShot = {};
    if (!rowsByShot[shotId]) rowsByShot[shotId] = [];
    var found = null;
    rowsByShot[shotId].forEach(function (r) { if (r.reviewer === name) found = r; });
    if (found) { Object.keys(patch).forEach(function (k) { found[k] = patch[k]; }); }
    else rowsByShot[shotId].push(Object.assign({ reviewer: name, verdict: '', note: '' }, patch));
  }

  function setVerdict(shotId, val) {
    var name = ensureReviewerName();
    if (!name) return;
    var current = myRow(shotId);
    var next = (current && current.verdict === val) ? '' : val; // click again to clear
    var note = current ? (current.note || '') : '';
    upsertLocalRow(shotId, { verdict: next, note: note });
    render();
    setSyncStatus('Saving…', false);
    postRows([{ reviewer: name, article_id: meta.articleId, article: meta.articleTitle, slot: shotId, shot_id: shotId, verdict: next, reasons: [], note: note, boxes: [] }])
      .then(function (resp) {
        if (resp && resp.ok) setSyncStatus('Saved', false);
        else setSyncStatus('Not saved — ' + (resp && resp.error ? resp.error : 'unknown error'), true);
      })
      .catch(function (e) { setSyncStatus('Not saved — network error (' + e.message + ')', true); });
  }

  function setNote(shotId, val) {
    val = val.trim();
    // 2026-09-01 (Milan): was getReviewerName() (non-blocking) - a note typed with no
    // cached name silently failed to save with no error shown at all, since the textarea
    // itself has no idea whether its blur handler's write actually landed. Matches
    // setVerdict's ensureReviewerName() now: prompts once if missing, shows a real error
    // (via ensureReviewerName's own setSyncStatus call) if the reviewer cancels.
    var name = ensureReviewerName();
    if (!name) return;
    var current = myRow(shotId);
    if (current && (current.note || '') === val) return;
    var verdict = current ? current.verdict : '';
    upsertLocalRow(shotId, { note: val });
    setSyncStatus('Saving…', false);
    postRows([{ reviewer: name, article_id: meta.articleId, article: meta.articleTitle, slot: shotId, shot_id: shotId, verdict: verdict, reasons: [], note: val, boxes: [] }])
      .then(function (resp) {
        if (resp && resp.ok) setSyncStatus('Saved', false);
        else setSyncStatus('Not saved — ' + (resp && resp.error ? resp.error : 'unknown error'), true);
      })
      .catch(function (e) { setSyncStatus('Not saved — network error (' + e.message + ')', true); });
  }

  function loadRows() {
    if (!SYNC_ENDPOINT) { setSyncStatus('Sync not configured', true); render(); return; }
    fetch(SYNC_ENDPOINT + '?mode=rows')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data || !Array.isArray(data.rows)) {
          // Old deployment (pre 2026-08-26) answers a plain GET with
          // {ok:true,sheet:"QA"} and has no ?mode=rows support at all.
          syncAvailable = false;
          setSyncStatus('Sync not available yet — verdicts display is disabled, but Pass/Fail still saves once you record one', true);
          render();
          return;
        }
        syncAvailable = true;
        rowsByShot = {};
        data.rows.forEach(function (row) {
          if (String(row.article_id) !== String(meta.articleId)) return;
          var sid = String(row.shot_id || row.slot);
          if (!rowsByShot[sid]) rowsByShot[sid] = [];
          rowsByShot[sid].push(row);
        });
        setSyncStatus('Synced', false);
        setTimeout(function () { setSyncStatus('', false); }, 2500);
        render();
      })
      .catch(function (e) {
        syncError = e;
        setSyncStatus('Sync not available (' + e.message + ') — Pass/Fail still saves, but you won’t see existing verdicts until this loads', true);
        render();
      });
  }

  var reviewerInput = document.getElementById('reviewer-name');
  if (reviewerInput) {
    reviewerInput.value = getReviewerName();
    reviewerInput.addEventListener('change', function () { setReviewerName(reviewerInput.value); render(); });
    reviewerInput.addEventListener('blur', function () { setReviewerName(reviewerInput.value); });
  }

  render();
  loadRows();
})();
</script>
