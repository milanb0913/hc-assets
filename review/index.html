<title>HC Capture Shot Review</title>
<style id="head-styles">
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

:root {
  --bg: #f2f3f6; --surface: #ffffff; --surface-sunken: #eceef2; --ink: #1e2430;
  --ink-soft: #4b5266; --muted: #767e91; --border: #dfe2e9; --accent: #c2185b;
  --accent-soft: #fbe4ec;
  --pass: #1a7a4c; --pass-soft: #e4f5ec; --fail: #b3261e; --fail-soft: #fbe9e7;
  --pending: #8a6d00; --pending-soft: #fbf3d9; --shadow: rgba(30, 36, 48, 0.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a22; --surface: #1e2430; --surface-sunken: #191d26; --ink: #eceff4;
    --ink-soft: #b7bdcc; --muted: #8b91a3; --border: #2d3444; --accent: #ec5c8d;
    --accent-soft: #3a2431;
    --pass: #4fd08c; --pass-soft: #16281f; --fail: #ff6b61; --fail-soft: #2c1815;
    --pending: #e0c04a; --pending-soft: #2c2611; --shadow: rgba(0, 0, 0, 0.45);
  }
}
:root[data-theme="dark"] {
  --bg: #161a22; --surface: #1e2430; --surface-sunken: #191d26; --ink: #eceff4;
  --ink-soft: #b7bdcc; --muted: #8b91a3; --border: #2d3444; --accent: #ec5c8d;
  --accent-soft: #3a2431;
  --pass: #4fd08c; --pass-soft: #16281f; --fail: #ff6b61; --fail-soft: #2c1815;
  --pending: #e0c04a; --pending-soft: #2c2611; --shadow: rgba(0, 0, 0, 0.45);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); }
body { color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; line-height: 1.5; }
a { color: inherit; }
.masthead {
  position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 22px clamp(20px, 5vw, 56px) 18px;
}
.masthead h1 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 1.6rem; margin: 0 0 10px; }
.hero-stats { display: flex; gap: 32px; margin-bottom: 6px; }
.hero-stat { display: flex; flex-direction: column; gap: 2px; }
.hero-stat .num { font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 1.9rem; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
.hero-stat .num .of { color: var(--muted); font-size: 1.15rem; font-weight: 500; }
.hero-stat .lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
.sync-status { font-size: 0.78rem; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
.save-status-error { color: var(--fail); font-weight: 600; }
.layout { display: flex; align-items: flex-start; gap: 28px; max-width: 1280px; margin: 0 auto; padding: 24px clamp(16px, 5vw, 56px) 100px; }
.sidebar {
  flex: 0 0 210px; position: sticky; top: 190px; display: flex; flex-direction: column; gap: 9px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px;
  box-shadow: 0 1px 2px var(--shadow);
}
.sidebar h3 { margin: 0 0 2px; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
.sidebar-stat { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.84rem; color: var(--ink-soft); }
.sidebar-stat .n { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
.sidebar-stat.stat-blocked .n { color: var(--accent); }
.sidebar-stat.stat-fail .n { color: var(--fail); }
.sidebar-stat.stat-review .n { color: var(--pending); }
.sidebar-stat.stat-ready .n { color: var(--pass); }
.sidebar-stat.stat-muted .n { color: var(--muted); }
.sidebar-stat.sidebar-total { padding-top: 7px; margin-top: 3px; border-top: 1px dashed var(--border); color: var(--muted); }
main#main-content { flex: 1 1 auto; min-width: 0; }
.hc-section { margin-bottom: 44px; }
.hc-section > h2 {
  font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 1.4rem;
  margin: 0 0 18px; padding-bottom: 8px; border-bottom: 2px solid var(--ink);
}
.subsection { margin-bottom: 22px; }
.subsection h3 { font-size: 0.92rem; font-weight: 600; color: var(--ink-soft); margin: 0 0 10px; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 11px 16px; box-shadow: 0 1px 2px var(--shadow);
  transition: border-color 0.12s, transform 0.12s;
}
.row:hover { border-color: var(--accent); transform: translateY(-1px); }
.row-unbuilt { opacity: 0.72; }
.row-head { display: flex; align-items: center; gap: 12px; }
.row-link {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  text-decoration: none; color: var(--ink); flex: 1; min-width: 0;
}
.row-link-muted { color: var(--ink); }
.row-main { display: flex; align-items: center; gap: 10px; min-width: 200px; flex: 1; flex-wrap: wrap; }
.row-title { font-weight: 500; font-size: 0.9rem; }
.row-id { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
.row-id-link { text-decoration: none; }
.row-id-link:hover { color: var(--accent); text-decoration: underline; }
.row-counts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.status-badge {
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.02em; padding: 3px 10px; border-radius: 100px;
  white-space: nowrap; text-transform: uppercase;
}
.status-fail { background: var(--fail-soft); color: var(--fail); }
.status-review { background: var(--pending-soft); color: var(--pending); }
.status-blocked { background: var(--accent-soft); color: var(--accent); }
.status-ready { background: var(--pass-soft); color: var(--pass); }
.status-muted { background: var(--surface-sunken); color: var(--muted); }
.chip { font-size: 0.7rem; font-weight: 600; padding: 2px 9px; border-radius: 100px; white-space: nowrap; }
.chip-progress { background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums; }
.chip-pass { background: var(--pass-soft); color: var(--pass); }
.chip-fail { background: var(--fail-soft); color: var(--fail); }
.chip-blocked { background: var(--accent-soft); color: var(--accent); cursor: help; }
.chip-pending { background: var(--surface-sunken); color: var(--muted); }
.chip-neutral { background: var(--surface-sunken); color: var(--muted); }
.chip-frozen { background: var(--surface-sunken); color: var(--muted); font-style: italic; }
.row-arrow { font-size: 0.78rem; font-weight: 600; color: var(--accent); white-space: nowrap; }
.row-arrow-muted { color: var(--muted); font-weight: 500; }
.publish-btn {
  font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 0.72rem; font-weight: 700;
  padding: 4px 12px; border-radius: 100px; border: 1px solid var(--pass); background: var(--pass-soft);
  color: var(--pass); cursor: pointer; white-space: nowrap; letter-spacing: 0.02em;
}
.publish-btn:hover { background: var(--pass); color: var(--surface); }
.publish-btn:disabled { opacity: 0.6; cursor: wait; }
.publish-badge {
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.02em; padding: 3px 10px; border-radius: 100px;
  white-space: nowrap;
}
.publish-badge-pending { background: var(--pending-soft); color: var(--pending); }
.publish-badge-done { background: var(--surface-sunken); color: var(--muted); }
.publish-error { font-size: 0.7rem; color: var(--fail); margin-left: 6px; }
.row-extras {
  margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border);
  font-size: 0.78rem; color: var(--ink-soft); display: flex; flex-direction: column; gap: 8px;
}
.row-extra { align-self: flex-start; }
/* The bottom-half notes block, made deliberately more prominent than the
   inline "Assigned" chip above it, per Milan's request 2026-08-28. */
.row-notes {
  background: var(--surface-sunken); border-radius: 8px; padding: 10px 12px;
  font-size: 0.84rem; color: var(--ink); line-height: 1.45; white-space: pre-wrap;
}
.row-notes-label {
  display: block; font-size: 0.66rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px;
}

/* ---- Content track (2026-09-02) - first UI for B114/B115's designed Content capture/QA
   layer. Deliberately reuses the Shot-side visual language (.chip-pass/-fail/-pending for QA,
   a .status-badge-shaped pill for capture, .publish-btn's shape for the vote buttons) rather
   than inventing a second style system for what's conceptually the same kind of status. ---- */
.content-track { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.content-badge {
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.02em; padding: 3px 10px; border-radius: 100px;
  white-space: nowrap; text-transform: uppercase;
}
.content-badge-notstarted { background: var(--surface-sunken); color: var(--muted); }
.content-badge-drafted { background: var(--accent-soft); color: var(--accent); }
.content-draft-link { font-size: 0.78rem; font-weight: 600; color: var(--accent); text-decoration: none; white-space: nowrap; }
.content-draft-link:hover { text-decoration: underline; }
.content-qa-actions { display: inline-flex; gap: 6px; }
.content-qa-btn {
  font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 0.72rem; font-weight: 700;
  padding: 4px 12px; border-radius: 100px; cursor: pointer; white-space: nowrap; letter-spacing: 0.02em;
}
.content-qa-btn:disabled { opacity: 0.6; cursor: wait; }
.content-qa-btn-pass { border: 1px solid var(--pass); background: var(--pass-soft); color: var(--pass); }
.content-qa-btn-pass:hover { background: var(--pass); color: var(--surface); }
.content-qa-btn-fail { border: 1px solid var(--fail); background: var(--fail-soft); color: var(--fail); }
.content-qa-btn-fail:hover { background: var(--fail); color: var(--surface); }
.hc-section.filter-hidden, .subsection.filter-hidden, .row.filter-hidden { display: none !important; }

/* ---- Filters bar: a button + applied-filter chips, modeled on the real
   AwardSpring Task Board (2026-08-31 rebuild) - replaces three always-visible
   checkbox rows that read as clutter before any content. ---- */
.filters-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.filters-btn {
  display: inline-flex; align-items: center; gap: 7px; font-family: inherit; font-size: 0.84rem; font-weight: 600;
  color: var(--ink); background: var(--surface-sunken); border: 1.5px solid var(--border); border-radius: 100px;
  padding: 7px 16px; cursor: pointer;
}
.filters-btn:hover { border-color: var(--accent); }
.filters-count-badge { background: var(--accent); color: #fff; font-size: 0.7rem; font-weight: 700; border-radius: 100px; padding: 1px 8px; }
.applied-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.applied-chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--ink-soft);
  background: var(--accent-soft); border: 1.5px solid var(--accent); border-radius: 100px; padding: 5px 6px 5px 12px;
}
.applied-chip b { color: var(--ink); font-weight: 600; }
.applied-chip button { background: none; border: none; cursor: pointer; font-size: 0.82rem; color: var(--ink-soft); padding: 2px 4px; line-height: 1; }
.applied-chip button:hover { color: var(--accent); }
.reset-filters-btn {
  font-family: inherit; font-size: 0.8rem; font-weight: 600; color: var(--ink-soft); background: none;
  border: none; text-decoration: underline; cursor: pointer; padding: 4px;
}
.assignee-filter, .search-input {
  font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 0.82rem; color: var(--ink);
  background: var(--surface-sunken); border: 1.5px solid var(--border); border-radius: 100px;
  padding: 5px 14px;
}
.search-input { min-width: 200px; }
.assignee-filter:focus, .search-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.search-input::placeholder { color: var(--muted); }
.filter-count { font-size: 0.78rem; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; margin-left: auto; }

/* ---- Filters modal ---- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(20, 22, 28, 0.5); z-index: 20;
  align-items: flex-start; justify-content: center; padding: 8vh 20px;
  display: none;
}
.modal-overlay:not([hidden]) { display: flex; }
.modal {
  background: var(--surface); border-radius: 12px; width: min(640px, 100%); max-height: 80vh; overflow-y: auto;
  box-shadow: 0 12px 40px rgba(0,0,0,0.3); display: flex; flex-direction: column;
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between; padding: 18px 24px;
  border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface);
}
.modal-head h3 { font-family: 'Source Serif 4', Georgia, serif; font-size: 1.2rem; margin: 0; }
.modal-head button { font-family: inherit; font-size: 0.85rem; color: var(--accent); background: none; border: none; cursor: pointer; font-weight: 600; }
.modal-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.modal-create { padding: 20px 24px; border-right: 1px solid var(--border); }
.modal-applied-panel { padding: 20px 24px; }
.modal-create h4, .modal-applied-panel h4 { font-size: 0.92rem; margin: 0 0 12px; }
.modal-create label { display: block; font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 6px; }
.modal-create select, .modal-values select {
  width: 100%; font-family: inherit; font-size: 0.86rem; color: var(--ink); background: var(--surface-sunken);
  border: 1.5px solid var(--border); border-radius: 7px; padding: 8px 10px;
}
.modal-values { margin-top: 14px; display: flex; flex-direction: column; gap: 9px; max-height: 260px; overflow-y: auto; }
.modal-check { display: flex; align-items: center; gap: 9px; font-size: 0.86rem; color: var(--ink); cursor: pointer; }
.modal-check input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
.modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.btn-primary, .btn-secondary {
  font-family: inherit; font-size: 0.84rem; font-weight: 600; border-radius: 7px; padding: 8px 18px; cursor: pointer;
}
.btn-primary { background: var(--accent); color: #fff; border: 1.5px solid var(--accent); }
.btn-secondary { background: var(--surface); color: var(--ink-soft); border: 1.5px solid var(--border); }
.modal-empty { color: var(--muted); font-size: 0.84rem; }
.modal-applied-row { font-size: 0.86rem; color: var(--ink-soft); padding: 8px 0; border-bottom: 1px dashed var(--border); }
.modal-applied-row b { color: var(--ink); }
.modal-foot { display: flex; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: var(--surface); }
@media (max-width: 600px) { .modal-body { grid-template-columns: 1fr; } .modal-create { border-right: none; border-bottom: 1px solid var(--border); } }

.content-gate {
  background: var(--surface); border: 1.5px dashed var(--border); border-radius: 10px;
  padding: 40px 30px; text-align: center; max-width: 60ch; margin: 40px auto;
}
.content-gate h3 { font-family: 'Source Serif 4', Georgia, serif; margin: 0 0 10px; }
.content-gate p { color: var(--muted); font-size: 0.9rem; margin: 0; }
</style>
<div class="masthead">
  <h1>HC Capture — Shot Review</h1>
  <div id="headline" class="hero-stats"></div>
  <span id="sync-status" class="sync-status"></span>
  <div class="filters-bar">
    <button type="button" id="open-filters-btn" class="filters-btn"><span id="filters-btn-label">Filters</span></button>

<div class="modal-overlay" id="filters-modal-overlay" hidden>

</div>
<div class="layout">
  <aside class="sidebar" id="sidebar"><div id="sidebar-stats"></div></aside>
  <main id="main-content"></main>
</div>

<script id="render-script">// Client-side runtime for the STATIC (GitHub Pages) hub index page. Sibling
// of hub-client.js, adapted for the 2026-08-28 migration off claude.ai
// Artifacts (review/reports/OPEN-THREADS.md B86).
//
// Two things changed from the artifact-hub's data flow, both requested by
// Milan directly:
//   1. due/shipped counts come straight from the embedded all-articles-
//      status.json snapshot (data-status) - already the accurate,
//      B84-fixed source, no separate registry counts cache to go stale.
//   2. pass/fail/pending counts are aggregated HERE, client-side, from a
//      fresh GET of the review-sync.gs Sheet (data-sync-endpoint) instead of
//      read from registry.articles[id].counts - removing the whole
//      "registry counts never gets refreshed" bug class.
//
// 2026-08-31 (later): filters rebuilt as a Filters button + modal (Product /
// Type / Section / Status, each its own dimension, applied filters shown as
// removable/editable chips) - modeled directly on AwardSpring's own Task
// Board filter UI, walked live in Chrome before building this. Replaces the
// old always-visible three-row checkbox bank, which read as "20 different
// toggles" before any content.
//
// Assigned-to / notes / signed-off are shown READ-ONLY (last known values
// from qa/review-doc-registry.json at build time) - there is no write-back
// path for them in this stopgap; editing those still happens in the
// claude.ai hub until a real fix (see this file's own TODO note in the
// rendered page).
(function () {
  var struct = JSON.parse(document.getElementById('data-structure').textContent);
  var statusList = JSON.parse(document.getElementById('data-status').textContent);
  var buildMap = JSON.parse(document.getElementById('data-buildmap').textContent); // id -> relPath
  var hcUrls = JSON.parse(document.getElementById('data-hcurls').textContent); // id -> live HC article url
  // Donor Management article ids (separate product line, out of scope for this
  // capture pass entirely) - see qa/donor-management-ids.json for how this list
  // was built. Added 2026-08-28 per Milan: an out-of-scope article showing the
  // same "No data" badge as genuine unstarted SM backlog reads as pending work
  // it isn't.
  var dmIds = {};
  (JSON.parse(document.getElementById('data-dmids').textContent) || []).forEach(function (id) { dmIds[id] = true; });
  // Release Notes ids - excluded ENTIRELY (2026-08-31, per Milan), not merely
  // filtered like Donor Management. Ownership of RN's upkeep is undecided
  // (this workflow vs. the product team), so it doesn't even get a toggle -
  // dropped from statusList before anything else runs.
  var rnIds = {};
  (JSON.parse(document.getElementById('data-rnids').textContent) || []).forEach(function (id) { rnIds[id] = true; });
  statusList = statusList.filter(function (a) { return !rnIds[a.id]; });
  var notes = JSON.parse(document.getElementById('data-notes').textContent);
  var assigned = JSON.parse(document.getElementById('data-assigned').textContent);
  var signedOff = JSON.parse(document.getElementById('data-signedoff').textContent);
  var SYNC_ENDPOINT = document.getElementById('data-sync-endpoint').textContent.trim();

  var statusById = {};
  statusList.forEach(function (a) { statusById[a.id] = a; });

  var mappedIds = {};
  struct.sections.forEach(function (sec) {
    sec.subsections.forEach(function (sub) {
      sub.articles.forEach(function (id) { mappedIds[id] = true; });
    });
  });
  var unmapped = statusList.filter(function (a) { return !mappedIds[a.id]; });

  // article_id -> { pass, fail } aggregated from live Sheet rows. Filled in
  // by loadSyncCounts(); empty object until that resolves, which just means
  // every article shows 0/0 until the fetch lands (still renders the
  // due/shipped numbers immediately - those never depended on the fetch).
  var syncCounts = {};
  var syncLoaded = false;

  // Publish-request state, article_id -> {state: 'requested'|'published', when, who}.
  // Piggybacks on the SAME review-sync.gs endpoint and upsert-by-(article,slot,
  // reviewer) mechanism the verdict rows already use - a reserved slot value
  // ('__publish__') that will never collide with a real shot id (no real shot
  // id in this project uses underscores). No review-sync.gs change needed: doPost
  // already stores any (article_id, slot, reviewer, verdict) tuple, and doGet
  // ?mode=rows already returns it - this is purely additive.
  //
  // UPDATE 2026-09-01 (Milan): reviewer is now the real cached name, not a fixed
  // 'hub' sentinel - so a second person publishing the SAME article upserts their
  // OWN row (different (article,slot,reviewer) key) rather than overwriting the
  // first person's, meaning more than one '__publish__' row can exist per article.
  // The aggregation below has to pick the most-recently-updated one explicitly
  // (by updated_at) rather than trust iteration order to already be chronological -
  // it isn't, once more than one reviewer can be upserting the same slot.
  var publishRequested = {};

  // Content track (2026-09-02) - first piece of B114/B115's designed-but-unbuilt Content
  // capture/QA layer. Same reserved-slot trick as Publish: slot '__content__', never a real
  // shot id. Two things live here, both read-mostly from this UI's point of view:
  //   - Capture status (Not Started / Drafted) is NOT a verdict - it's computed from whether
  //     review-sync.gs's article-level draft_url/stale_prose/stale_prose_note fields have ever
  //     been set for this article. Nothing in this file WRITES those fields - they're meant to
  //     come from a future Claude drafting pass (unbuilt) or Milan setting them by hand. This
  //     file only displays whatever's already there.
  //   - QA status (Unreviewed / Passed / Failed) IS a verdict, fail-wins across every reviewer
  //     who's voted - same aggregation rule as Shot QA (disagreement should surface, not average
  //     away), just collapsed to one article-wide badge instead of per-shot. Voting posts your
  //     own (article, '__content__', your-cached-name) row; it does not toggle-to-clear the way
  //     per-shot verdicts do in review-static-client.js - changing your mind means clicking the
  //     other button, which upserts your same row to the new value.
  // article_id -> { verdict: ''|'pass'|'fail', draftUrl, staleProse, staleProseNote }
  var contentByArticle = {};

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Same key/pattern as review-static-client.js's reviewer-name cache, deliberately -
  // a name entered once on either page is shared across both, one identity for the
  // whole review system, not a separate prompt per surface. Milan, 2026-09-01: publish
  // requests need to say WHO published, not just that someone did.
  var REVIEWER_KEY = 'hc_review_reviewer_name';
  function getReviewerName() {
    try { return (localStorage.getItem(REVIEWER_KEY) || '').trim(); } catch (e) { return ''; }
  }
  function setReviewerName(v) {
    try { localStorage.setItem(REVIEWER_KEY, v.trim()); } catch (e) { /* ignore */ }
  }
  function ensureReviewerName() {
    var name = getReviewerName();
    if (name) return name;
    name = (window.prompt('Enter your name to publish (saved on this device, asked once):') || '').trim();
    if (!name) return null;
    setReviewerName(name);
    return name;
  }

  function sectionAnchor(name) { return 'sec-' + name.replace(/\W+/g, '-'); }

  // Same due/dueShipped population discipline as the old hub-client.js -
  // totalShots/legacyImageCount (frozen/non-due) never drive progress math.
  function countsFor(a) {
    var agg = syncCounts[a.id] || { pass: 0, fail: 0 };
    var dueShipped = a.dueShippedCount || 0;
    var pass = Math.min(agg.pass, dueShipped);
    var fail = Math.min(agg.fail, dueShipped - pass < 0 ? 0 : agg.fail);
    var neutral = Math.max(0, dueShipped - pass - fail);
    return { pass: pass, fail: fail, neutral: neutral };
  }

  function computeStatus(a, c) {
    // "Signed Off" retired 2026-08-31 (Milan, review/reports/OPEN-THREADS.md B115) - it used to
    // be checked FIRST here, meaning it could override and show "Signed Off" on an article that
    // wasn't even fully captured yet (the exact premature-sign-off bug this file used to flag as
    // still-open). Everything it was used for already has a home: "reviewed, ship it" is Ready to
    // Publish below; "reviewed, confirmed nothing to capture, permanently" (the Static Reports
    // family) is Nothing Due/No Shot below, with the human confirmation already preserved in that
    // article's own hub note - no status-level flag needed for it.
    if (dmIds[a.id]) return 'out-of-scope';
    if (!a.hasManifest) {
      // A structurally shotless article (the live HC page itself has zero
      // images) can never have "backlog" - there is nothing to capture, ever.
      // Distinct from a real no-manifest article with live images waiting.
      if (!a.legacyImageCount) return 'no-shots';
      return 'no-data';
    }
    var due = a.dueShots || 0;
    if (due === 0) return 'no-due-shots';
    // Started - Team Needed (2026-08-31, Milan): the article-level roll-up of the shot-level
    // structured `blocked` signal (see survey-all-articles.mjs). Checked BEFORE Has Fails -
    // a shot that's blocked is never shipped, so this and "fully captured" can't overlap, but
    // "needs you right now" is the more urgent thing to surface than a fail Claude could
    // eventually retry on its own. A blocked shot's dueShipped can never reach due, which is
    // exactly why plain "In Progress" is gone: under autonomous operation, the ONLY reason
    // capture sits partway done for any real duration is a genuine blocker - anything else
    // resolves in the same session and isn't worth a distinct status a human has to read.
    if (hasBlockedShot(a)) return 'blocked';
    var dueShipped = a.dueShippedCount || 0;
    if (c.fail > 0) return 'has-fails';
    // Merged into Not Started (2026-08-31) rather than kept as its own "In Progress" state -
    // see the comment above. From a human's perspective "no manifest yet" and "manifest
    // exists, unblocked, still capturing" mean the same thing: nothing for you to do here.
    if (dueShipped < due) return 'no-data';
    if (c.neutral > 0) return 'needs-review';
    return 'ready';
  }

  function hasBlockedShot(a) {
    return (a.shots || []).some(function (s) { return s.blockedForTeam; });
  }

  // Vocabulary finalized with Milan 2026-08-31 (review/reports/OPEN-THREADS.md B114/B115),
  // then revised the same day: "In Progress" retired (see computeStatus's own comment),
  // "Has Fails"/"blocked" relabeled to make clear both are sub-states of "capture has
  // started" - Title Case throughout, "N/A"->"No Shot" (same word as the capture-track
  // label it pairs with, deliberately not a second word for the same idea).
  var STATUS_ORDER = ['blocked', 'has-fails', 'needs-review', 'ready', 'no-due-shots', 'no-data', 'out-of-scope', 'no-shots'];
  var STATUS_META = {
    'blocked':      { label: 'Started — Team Needed', cls: 'status-blocked' },
    'has-fails':    { label: 'Started with Fails',    cls: 'status-fail' },
    'needs-review': { label: 'Needs Review',          cls: 'status-review' },
    'ready':        { label: 'Ready to Publish',      cls: 'status-ready' },
    'no-due-shots': { label: 'Nothing Due',           cls: 'status-muted' },
    'no-data':      { label: 'Not Started',           cls: 'status-muted' },
    'out-of-scope': { label: 'DM',                    cls: 'status-muted' },
    'no-shots':     { label: 'No Shot',               cls: 'status-muted' },
  };

  function articleRow(id) {
    var a = statusById[id];
    var note = notes[id] || '';
    var assignedVal = assigned[id] || '';

    if (!a) {
      return '<div class="row" data-status="no-data" data-assigned="' + esc(assignedVal) + '">' +
        '<div class="row-link row-link-muted"><span class="row-title">#' + esc(id) + ' - not in local status data</span></div></div>';
    }

    var c = countsFor(a);
    var status = computeStatus(a, c);
    var meta = STATUS_META[status];
    var due = a.dueShots || 0;
    var dueShipped = a.dueShippedCount || 0;
    var relPath = buildMap[id];

    var progressChips;
    if (status === 'out-of-scope') {
      progressChips = '<span class="chip chip-neutral">Donor Management — not in this pass</span>';
    } else if (status === 'no-shots') {
      progressChips = '<span class="chip chip-neutral">live article has no images</span>';
    } else if (!a.hasManifest) {
      progressChips = '<span class="chip chip-neutral">not started</span>';
    } else if (due === 0) {
      progressChips = '<span class="chip chip-neutral">nothing due</span>';
    } else {
      // QA collapsed to one fraction (2026-08-31, Milan). Denominator is dueShipped, not
      // due - Passed only ever applies to shots that have actually been captured. The
      // explicit fail count was dropped the same day (also Milan): it's inferable from
      // the status badge itself - "Started with Fails" vs "Needs Review" already tells
      // you WHICH kind of gap the remaining (dueShipped - pass) represents, so a second
      // numeric chip for it was redundant, not new information.
      progressChips = (
        '<span class="chip chip-progress">' + dueShipped + '/' + due + ' captured</span>' +
        '<span class="chip chip-pass">' + c.pass + '/' + dueShipped + ' Passed</span>'
      );
      var blockedShots = (a.shots || []).filter(function (s) { return s.blockedForTeam; });
      if (blockedShots.length) {
        var reason = blockedShots.map(function (s) { return s.blockedReason || s.id; }).join(' · ');
        progressChips += '<span class="chip chip-blocked" title="' + esc(reason) + '">' + blockedShots.length + ' blocked</span>';
      }
    }
    // "Frozen" used to lump two different things under one vague label (2026-08-31, Milan
    // flagged it). Split by what's actually true of each shot:
    // - notAScreenshot: genuinely not a product UI capture at all - a spreadsheet/report
    //   render (Static Reports, validation-report illustrations). Milan's own guess for
    //   what "frozen" meant - correct for THIS half.
    // - doNotRecapture (and not notAScreenshot): a real product screenshot, confirmed
    //   still current, deliberately not being re-touched - e.g. student-facing shots held
    //   because a rebrand hasn't shipped yet. Real UI, just not due - keeps the "frozen"
    //   word since that's still accurate here, just no longer conflated with the other case.
    var notScreenshotShots = (a.shots || []).filter(function (s) { return s.notAScreenshot; });
    var confirmedCurrentShots = (a.shots || []).filter(function (s) { return s.doNotRecapture && !s.notAScreenshot; });
    if (notScreenshotShots.length) {
      progressChips += '<span class="chip chip-frozen" title="Not a browser/product UI capture - a spreadsheet or report render">' + notScreenshotShots.length + ' not a screenshot</span>';
    }
    if (confirmedCurrentShots.length) {
      progressChips += '<span class="chip chip-frozen" title="Real product UI, confirmed still current - deliberately not recaptured">' + confirmedCurrentShots.length + ' frozen</span>';
    }

    var assignedHtml = assignedVal ? '<span class="row-extra">Assigned: ' + esc(assignedVal) + '</span>' : '';
    // A dedicated, more prominent block for the bottom half of the card - not
    // squeezed inline with Assigned, per Milan's request 2026-08-28.
    var notesHtml = note ? '<div class="row-notes"><span class="row-notes-label">Notes</span>' + esc(note) + '</div>' : '';

    var hcUrl = hcUrls[a.id];
    // The id is its OWN <a> to the live HC article now, sibling to (not
    // nested inside) linkHtml's own <a> - two anchors sharing one parent is
    // valid HTML, one anchor inside another is not. Replaces the earlier
    // separate "View live on Help Center" row per Milan's request.
    var idHtml = hcUrl
      ? '<a class="row-id row-id-link" href="' + esc(hcUrl) + '" target="_blank" rel="noopener" title="View live on Help Center">#' + esc(a.id) + '</a>'
      : '<span class="row-id">#' + esc(a.id) + '</span>';

    // Only ever shown on a 'ready' row - computeStatus() above already gates
    // that on every due shot shipped, zero Fails, zero unreviewed, so there is
    // no separate eligibility check to duplicate here.
    var publishHtml = '';
    if (status === 'ready') {
      var pr = publishRequested[a.id];
      var prWho = pr && pr.who ? ' — ' + esc(pr.who) : '';
      if (pr && pr.state === 'published') {
        publishHtml = '<span class="publish-badge publish-badge-done" title="' + esc(pr.who || '') + ' · ' + esc(pr.when) + '">Published' + prWho + '</span>';
      } else if (pr && pr.state === 'requested') {
        publishHtml = '<span class="publish-badge publish-badge-pending" title="' + esc(pr.who || '') + ' · ' + esc(pr.when) + '">Publish requested' + prWho + '</span>';
      } else {
        publishHtml = '<button type="button" class="publish-btn" data-publish-id="' + esc(a.id) +
          '" data-publish-title="' + esc(a.articleTitle || a.title || '') + '">Publish</button>';
      }
    }

    // Content track (2026-09-02) - shown once shot capture is actually done, not before.
    // "Shots reach All Done" (B115's own trigger condition for Content-Overhaul to unlock on an
    // article) means every due shot is shipped - has-fails/needs-review/ready all satisfy that
    // (dueShipped >= due is exactly what separates them from no-data/blocked in computeStatus
    // above); QA outcome on the shots doesn't matter for whether Content work is relevant.
    var contentHtml = '';
    if (status === 'has-fails' || status === 'needs-review' || status === 'ready') {
      var cc = contentByArticle[a.id] || { verdict: '', draftUrl: '', staleProse: '', staleProseNote: '' };
      var hasDraft = !!(cc.draftUrl || cc.staleProse || cc.staleProseNote);
      var captureBadge = hasDraft
        ? '<span class="content-badge content-badge-drafted">Content: Drafted</span>'
        : '<span class="content-badge content-badge-notstarted">Content: Not Started</span>';
      var draftLinkHtml = cc.draftUrl
        ? ' <a class="content-draft-link" href="' + esc(cc.draftUrl) + '" target="_blank" rel="noopener">View draft →</a>'
        : '';
      var qaMeta = cc.verdict === 'fail' ? { cls: 'chip-fail', label: 'Content QA: Failed' }
        : cc.verdict === 'pass' ? { cls: 'chip-pass', label: 'Content QA: Passed' }
        : { cls: 'chip-pending', label: 'Content QA: Unreviewed' };
      var qaBadge = '<span class="chip ' + qaMeta.cls + '">' + esc(qaMeta.label) + '</span>';
      // Buttons stay visible regardless of current verdict, on purpose - a second reviewer
      // voting is how disagreement (fail-wins) gets recorded at all, same reasoning as
      // per-shot QA. This is a vote, not a toggle: clicking upserts YOUR row to that value,
      // it does not clear an existing vote the way review-static-client.js's setVerdict does.
      var qaActions = '<span class="content-qa-actions">' +
        '<button type="button" class="content-qa-btn content-qa-btn-pass" data-content-id="' + esc(a.id) +
          '" data-content-title="' + esc(a.articleTitle || a.title || '') + '" data-content-val="pass">Pass</button>' +
        '<button type="button" class="content-qa-btn content-qa-btn-fail" data-content-id="' + esc(a.id) +
          '" data-content-title="' + esc(a.articleTitle || a.title || '') + '" data-content-val="fail">Fail</button>' +
        '</span>';
      var staleNoteHtml = cc.staleProseNote
        ? '<div class="row-notes"><span class="row-notes-label">Content notes</span>' + esc(cc.staleProseNote) + '</div>'
        : '';
      contentHtml = '<div class="content-track">' + captureBadge + draftLinkHtml + qaBadge + qaActions + '</div>' + staleNoteHtml;
    }

    var inner = (
      '<div class="row-main">' +
        '<span class="status-badge ' + meta.cls + '">' + esc(meta.label) + '</span>' +
        '<span class="row-title">' + esc(a.articleTitle || a.title) + '</span>' +
      '</div>' +
      '<div class="row-counts">' + progressChips + '</div>'
    );
    var collection = dmIds[id] ? 'DM' : 'SM';
    // Every real row is 'overhaul' today - see the Campaign dimension's own comment above.
    var dataAttrs = 'data-status="' + status + '" data-assigned="' + esc(assignedVal) + '" data-collection="' + collection + '" data-campaign="overhaul"';
    var linkHtml = relPath
      ? '<a class="row-link" href="' + esc(relPath) + '" target="_blank" rel="noopener">' + inner + '<span class="row-arrow">Open →</span></a>'
      : '<div class="row-link row-link-muted">' + inner + '<span class="row-arrow row-arrow-muted">Not built yet</span></div>';
    return '<div class="row' + (relPath ? '' : ' row-unbuilt') + '" ' + dataAttrs + '>' +
      '<div class="row-head">' + linkHtml + idHtml + publishHtml + '</div>' +
      (assignedHtml || notesHtml || contentHtml ? '<div class="row-extras">' + assignedHtml + notesHtml + contentHtml + '</div>' : '') +
      '</div>';
  }

  // A dimension whose "not real yet" value is selected ALONE (without its real
  // counterpart) gets an honest empty-state instead of a silently-empty or
  // silently-wrong row list. Both Type=Content and Campaign=New Release are
  // this same shape today - genuine concepts, zero real data behind them yet.
  var HONEST_GATES = [
    { dim: 'type', soloValue: 'content', otherValue: 'shots',
      title: 'Content tracking isn’t wired up yet',
      body: 'There’s no real data source for article content/prose progress yet - nothing shown here would reflect actual work. Switch the Type filter back to Shots to see real status.' },
    { dim: 'campaign', soloValue: 'release', otherValue: 'overhaul',
      title: 'No articles are tagged to a specific release yet',
      body: 'Every real row today is Overhaul work - release-driven capture/content hasn’t started landing here yet. Switch Campaign back to Overhaul (or clear it) to see real status.' },
  ];
  function gateMessage() {
    for (var i = 0; i < HONEST_GATES.length; i++) {
      var g = HONEST_GATES[i];
      var vals = appliedFilters[g.dim];
      if (vals.indexOf(g.soloValue) !== -1 && vals.indexOf(g.otherValue) === -1) {
        return '<div class="content-gate"><h3>' + esc(g.title) + '</h3><p>' + esc(g.body) + '</p></div>';
      }
    }
    return null;
  }

  function buildMain() {
    var gate = gateMessage();
    if (gate) return gate;

    var sectionsHtml = struct.sections.map(function (sec) {
      var subsHtml = sec.subsections.map(function (sub) {
        var rows = sub.articles.map(articleRow).join('\n');
        return '<div class="subsection"><h3>' + esc(sub.name) + '</h3><div class="rows">' + rows + '</div></div>';
      }).join('\n');
      return '<section class="hc-section" data-section="' + esc(sec.name) + '"><h2>' + esc(sec.name) + '</h2>' + subsHtml + '</section>';
    }).join('\n');

    var unmappedRows = unmapped.map(function (a) { return articleRow(a.id); }).join('\n');
    var anchors = struct.sections.map(function (sec) { return '<a id="' + sectionAnchor(sec.name) + '"></a>'; }).join('');
    var otherSection = unmapped.length ?
      '<section class="hc-section"><a id="sec-other"></a><h2>Other (not in the Scholarship Management collection — Donor Management, Release Notes, etc.)</h2><div class="subsection"><div class="rows">' + unmappedRows + '</div></div></section>'
      : '';
    return anchors + sectionsHtml + otherSection;
  }

  // Fixed 2026-08-31 (Milan caught it live: "88/107" vs the filter bar's "showing 90 of
  // 160" didn't reconcile). Two separate bugs were stacked:
  // 1. inScope used to skip any article without a manifest or with due===0 entirely -
  //    silently dropping 53 real SM articles (No Shot/Not Started/Nothing Due) from its
  //    own denominator, while the filter bar's "of 160" counts all of them. Same
  //    undercount-the-backlog shape this project has hit before.
  // 2. "articlesReady" meant "fully captured", NOT "Ready to Publish" - it counted an
  //    article as ready even with real Fails or unreviewed shots sitting in it. Of the
  //    88 it used to report, only 17 were genuinely Ready to Publish; the other 71 were
  //    fully-captured-but-flagged, which is exactly what surfaced when filtering to
  //    Has Fails/Needs Review. Fixed by reusing computeStatus() - the SAME thing the row
  //    badges already compute - instead of a second, looser definition living only here.
  function computeHeadlineCounts() {
    // Every real (non-DM) status bucket gets a slot, so the sidebar breakdown
    // always sums to exactly inScope - fixed 2026-08-31 (Milan caught it live:
    // "160 total but the breakdown numbers add up to less than 100"). The
    // previous version only tallied blocked/has-fails/needs-review/ready,
    // silently dropping no-data/no-due-shots/no-shots from the breakdown
    // entirely even though they're real, counted-elsewhere buckets (no-data
    // alone is most of the backlog - see [[hc-backlog-true-shape]]).
    var counts = {};
    STATUS_ORDER.forEach(function (k) { if (k !== 'out-of-scope') counts[k] = 0; });
    var inScope = 0;
    var articlesReady = 0, dueShotsTotal = 0, dueShotsShipped = 0;
    function tally(id) {
      if (dmIds[id]) return; // headline/sidebar stay DM-excluded by default, same as the row list
      var a = statusById[id];
      if (!a) return;
      inScope++;
      var due = a.dueShots || 0;
      var dueShipped = a.dueShippedCount || 0;
      if (a.hasManifest && due > 0) { dueShotsTotal += due; dueShotsShipped += dueShipped; }
      var c = countsFor(a);
      var status = computeStatus(a, c);
      if (counts[status] !== undefined) counts[status]++;
      // No Shot and Nothing Due are trivially ready - nothing exists to review, same
      // reasoning as the rest of this model (a confirmed-frozen or image-less article
      // isn't "behind," it's done).
      if (status === 'ready' || status === 'no-shots' || status === 'no-due-shots') articlesReady++;
    }
    struct.sections.forEach(function (sec) { sec.subsections.forEach(function (sub) { sub.articles.forEach(tally); }); });
    unmapped.forEach(function (a) { tally(a.id); });
    return { counts: counts, inScope: inScope, articlesReady: articlesReady, dueShotsTotal: dueShotsTotal, dueShotsShipped: dueShotsShipped };
  }

  function heroStatsHtml() {
    var h = computeHeadlineCounts();
    return (
      '<div class="hero-stat">' +
        '<span class="num">' + h.articlesReady + '<span class="of"> / ' + h.inScope + '</span></span>' +
        '<span class="lbl">Articles ready</span>' +
      '</div>' +
      '<div class="hero-stat">' +
        '<span class="num">' + h.dueShotsShipped + '<span class="of"> / ' + h.dueShotsTotal + '</span></span>' +
        '<span class="lbl">Shots ready</span>' +
      '</div>'
    );
  }

  // Every row here is one of STATUS_ORDER's real (non-DM) buckets, so the
  // sum of every "n" always equals "In scope" exactly - no bucket is silently
  // dropped the way no-data/no-due-shots/no-shots used to be.
  var SIDEBAR_ROWS = ['blocked', 'has-fails', 'needs-review', 'ready', 'no-data', 'no-due-shots', 'no-shots'];
  function sidebarHtml() {
    var h = computeHeadlineCounts();
    var rows = SIDEBAR_ROWS.map(function (k) {
      var meta = STATUS_META[k];
      return '<div class="sidebar-stat ' + meta.cls + '"><span>' + esc(meta.label) + '</span><span class="n">' + h.counts[k] + '</span></div>';
    }).join('');
    return '<h3>QA breakdown</h3>' + rows +
      '<div class="sidebar-stat stat-muted sidebar-total"><span>In scope</span><span class="n">' + h.inScope + '</span></div>';
  }

  function assigneeOptionsHtml() {
    var names = {};
    Object.keys(assigned).forEach(function (id) { if (assigned[id]) names[assigned[id]] = true; });
    return Object.keys(names).sort().map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('');
  }

  // ======================================================================
  // Filters: Filters button + modal, one dimension at a time, applied
  // filters shown as removable/editable chips. Rebuilt 2026-08-31 (Milan)
  // to match AwardSpring's own Task Board filter UI - walked it live in
  // Chrome first (Filter Settings > Create New Filter > Filter by > checkbox
  // list > Apply Filter > Applied Filters chips > Save Filters / Reset) and
  // confirmed: dimensions AND together, values within one dimension OR
  // together, an applied dimension drops out of the "Filter by" list (edit
  // via its own chip instead of re-adding it), Reset clears everything.
  //
  // A dimension with an EMPTY applied value list means "not filtering on
  // this" (show everything) - simpler than the old always-visible-checkbox
  // model, where an all-unchecked row meant "show nothing" for status but
  // "show nothing" for sections too (inconsistent, fixed here).
  // Campaign added 2026-08-31 (later) per Milan, directly closing the gap found
  // this session: Overhaul-vs-Release has been a real conceptual split with no
  // explicit field anywhere. Every article defaults to 'overhaul' below (see
  // articleRow's data-campaign) because literally nothing is Release-tagged in
  // the real data yet - same honest-placeholder shape as Type/Content: the
  // option exists so the vocabulary is already familiar once real per-release
  // tagging exists, rather than being a second UI change later.
  var DIMENSION_ORDER = ['product', 'type', 'section', 'status', 'campaign'];
  var DIMENSIONS = {
    product:  { label: 'Product',  options: [['SM', 'Scholarship Management'], ['DM', 'Donor Management']] },
    type:     { label: 'Type',     options: [['shots', 'Shots'], ['content', 'Content']] },
    section:  { label: 'Section',  options: struct.sections.map(function (s) { return [s.name, s.name]; }) },
    // 'out-of-scope' (the DM badge) is deliberately excluded from the Status filter's
    // own option list - which product a row belongs to is the Product axis's job now,
    // not Status's. STATUS_META still defines it, since a visible DM row still needs
    // its "DM" badge rendered - it's just not something you filter Status by any more.
    status:   { label: 'Status',   options: STATUS_ORDER.filter(function (k) { return k !== 'out-of-scope'; }).map(function (k) { return [k, STATUS_META[k].label]; }) },
    campaign: { label: 'Campaign', options: [['overhaul', 'Overhaul'], ['release', 'New Release']] },
  };

  // appliedFilters: the live, in-effect filter state. draftFilters: a working
  // copy edited inside the open modal, committed to appliedFilters only on
  // "Save Filters" (or discarded on "Cancel & Close") - mirrors the real
  // Task Board's own Apply-then-Save two-step exactly.
  var appliedFilters = { product: ['SM'], type: [], section: [], status: [], campaign: [] };
  var draftFilters = null;
  var editingDimension = null; // which dimension "Filter by" currently shows values for, inside the modal

  var STORAGE_KEY = 'hc-hub-filters-v2';
  function loadFilterState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function saveFilterState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appliedFilters)); } catch (e) {}
  }
  function restoreFilterState() {
    var saved = loadFilterState();
    if (!saved) return; // first visit - keep the seeded default (Product: SM)
    DIMENSION_ORDER.forEach(function (d) {
      if (Array.isArray(saved[d])) appliedFilters[d] = saved[d];
    });
  }

  function optionLabel(dim, value) {
    var opt = DIMENSIONS[dim].options.filter(function (o) { return o[0] === value; })[0];
    return opt ? opt[1] : value;
  }

  function appliedChipsHtml() {
    var chips = DIMENSION_ORDER.filter(function (d) { return appliedFilters[d] && appliedFilters[d].length; }).map(function (d) {
      var labels = appliedFilters[d].map(function (v) { return optionLabel(d, v); }).join(', ');
      return '<span class="applied-chip">' +
        '<button type="button" class="chip-edit" data-dim="' + d + '" title="Edit ' + esc(DIMENSIONS[d].label) + '">✎</button>' +
        '<b>' + esc(DIMENSIONS[d].label) + ':</b> ' + esc(labels) +
        '<button type="button" class="chip-remove" data-dim="' + d + '" title="Remove">✕</button>' +
      '</span>';
    }).join('');
    var anyApplied = DIMENSION_ORDER.some(function (d) { return appliedFilters[d] && appliedFilters[d].length; });
    var resetBtn = anyApplied ? '<button type="button" id="reset-filters-btn" class="reset-filters-btn">Reset filters</button>' : '';
    return chips + resetBtn;
  }

  function filtersButtonHtml() {
    var count = DIMENSION_ORDER.filter(function (d) { return appliedFilters[d] && appliedFilters[d].length; }).length;
    return 'Filters' + (count ? ' <span class="filters-count-badge">' + count + '</span>' : '');
  }

  function modalFilterByOptionsHtml() {
    var available = DIMENSION_ORDER.filter(function (d) { return !(draftFilters[d] && draftFilters[d].length); });
    return '<option value="">Select from list</option>' + available.map(function (d) {
      return '<option value="' + d + '"' + (editingDimension === d ? ' selected' : '') + '>' + esc(DIMENSIONS[d].label) + '</option>';
    }).join('');
  }

  function modalValuesHtml() {
    if (!editingDimension) return '';
    var dim = editingDimension;
    var current = draftFilters[dim] || [];
    var boxes = DIMENSIONS[dim].options.map(function (o) {
      var checked = current.indexOf(o[0]) !== -1 ? ' checked' : '';
      return '<label class="modal-check"><input type="checkbox" data-value="' + esc(o[0]) + '"' + checked + '> ' + esc(o[1]) + '</label>';
    }).join('');
    return '<div class="modal-values">' + boxes + '</div>' +
      '<div class="modal-actions"><button type="button" id="apply-filter-btn" class="btn-primary">Apply Filter</button>' +
      '<button type="button" id="cancel-filter-btn" class="btn-secondary">Cancel</button></div>';
  }

  function modalAppliedHtml() {
    var dims = DIMENSION_ORDER.filter(function (d) { return draftFilters[d] && draftFilters[d].length; });
    if (!dims.length) return '<p class="modal-empty">No filters applied yet.</p>';
    return dims.map(function (d) {
      var labels = draftFilters[d].map(function (v) { return optionLabel(d, v); }).join(', ');
      return '<div class="modal-applied-row"><b>' + esc(DIMENSIONS[d].label) + ':</b> ' + esc(labels) + '</div>';
    }).join('');
  }

  function renderModal() {
    var modal = document.getElementById('filters-modal');
    if (!modal) return;
    document.getElementById('filter-by-select').innerHTML = modalFilterByOptionsHtml();
    document.getElementById('filter-by-select').value = editingDimension || '';
    document.getElementById('modal-values-wrap').innerHTML = modalValuesHtml();
    var appliedCountEls = document.querySelectorAll('#modal-applied-count');
    var count = DIMENSION_ORDER.filter(function (d) { return draftFilters[d] && draftFilters[d].length; }).length;
    Array.prototype.forEach.call(appliedCountEls, function (el) { el.textContent = count; });
    document.getElementById('modal-applied-list').innerHTML = modalAppliedHtml();
    wireModalValueCheckboxes();
  }

  function openModal() {
    draftFilters = {};
    DIMENSION_ORDER.forEach(function (d) { draftFilters[d] = appliedFilters[d].slice(); });
    editingDimension = null;
    document.getElementById('filters-modal-overlay').hidden = false;
    renderModal();
  }
  function closeModal() {
    document.getElementById('filters-modal-overlay').hidden = true;
    draftFilters = null;
    editingDimension = null;
  }

  function wireModalValueCheckboxes() {
    var wrap = document.getElementById('modal-values-wrap');
    if (!wrap) return;
    Array.prototype.forEach.call(wrap.querySelectorAll('input[type="checkbox"][data-value]'), function (cb) {
      cb.addEventListener('change', function () {
        if (!editingDimension) return;
        var list = draftFilters[editingDimension] || [];
        var v = cb.getAttribute('data-value');
        var idx = list.indexOf(v);
        if (cb.checked && idx === -1) list.push(v);
        if (!cb.checked && idx !== -1) list.splice(idx, 1);
        draftFilters[editingDimension] = list;
      });
    });
    var applyBtn = document.getElementById('apply-filter-btn');
    if (applyBtn) applyBtn.addEventListener('click', function () {
      editingDimension = null;
      renderModal();
    });
    var cancelBtn = document.getElementById('cancel-filter-btn');
    if (cancelBtn) cancelBtn.addEventListener('click', function () {
      editingDimension = null;
      renderModal();
    });
  }

  var modalControlsWired = false;
  function wireModalControls() {
    if (modalControlsWired) return;
    modalControlsWired = true;
    document.getElementById('open-filters-btn').addEventListener('click', openModal);
    document.getElementById('modal-close-btn').addEventListener('click', closeModal);
    document.getElementById('filters-modal-overlay').addEventListener('click', function (e) {
      if (e.target.id === 'filters-modal-overlay') closeModal();
    });
    document.getElementById('filter-by-select').addEventListener('change', function () {
      editingDimension = this.value || null;
      renderModal();
    });
    document.getElementById('modal-save-btn').addEventListener('click', function () {
      DIMENSION_ORDER.forEach(function (d) { appliedFilters[d] = (draftFilters[d] || []).slice(); });
      saveFilterState();
      closeModal();
      applyFilters();
    });
    document.getElementById('modal-reset-btn').addEventListener('click', function () {
      DIMENSION_ORDER.forEach(function (d) { draftFilters[d] = []; });
      editingDimension = null;
      renderModal();
    });
    document.body.addEventListener('click', function (e) {
      var editBtn = e.target.closest && e.target.closest('.chip-edit');
      if (editBtn) {
        openModal();
        editingDimension = editBtn.getAttribute('data-dim');
        renderModal();
        return;
      }
      var removeBtn = e.target.closest && e.target.closest('.chip-remove');
      if (removeBtn) {
        appliedFilters[removeBtn.getAttribute('data-dim')] = [];
        saveFilterState();
        applyFilters();
        return;
      }
      if (e.target.id === 'reset-filters-btn') {
        DIMENSION_ORDER.forEach(function (d) { appliedFilters[d] = []; });
        saveFilterState();
        applyFilters();
      }
      var pubBtn = e.target.closest && e.target.closest('.publish-btn');
      if (pubBtn) {
        e.preventDefault(); // row-head has no enclosing <a>, but stay defensive if that changes
        requestPublish(pubBtn.getAttribute('data-publish-id'), pubBtn.getAttribute('data-publish-title'), pubBtn);
      }
      var contentBtn = e.target.closest && e.target.closest('.content-qa-btn');
      if (contentBtn) {
        e.preventDefault(); // same row-extras-has-no-enclosing-<a> reasoning as publish-btn above
        setContentVerdict(contentBtn.getAttribute('data-content-id'), contentBtn.getAttribute('data-content-title'),
          contentBtn.getAttribute('data-content-val'), contentBtn);
      }
    });
    var assigneeSelect = document.getElementById('assignee-filter');
    if (assigneeSelect) assigneeSelect.addEventListener('change', applyFilters);
    var searchInput = document.getElementById('search-input');
    if (searchInput) searchInput.addEventListener('input', applyFilters);
  }

  function rowMatches(row) {
    var status = row.getAttribute('data-status');
    if (appliedFilters.status.length && appliedFilters.status.indexOf(status) === -1) return false;
    var assigneeSelect = document.getElementById('assignee-filter');
    var assignee = assigneeSelect ? assigneeSelect.value : '';
    if (assignee) {
      var rowAssignee = row.getAttribute('data-assigned') || '';
      if (assignee === '__unassigned__' ? rowAssignee !== '' : rowAssignee !== assignee) return false;
    }
    var searchInput = document.getElementById('search-input');
    var q = searchInput ? searchInput.value.trim().toLowerCase() : '';
    if (q) {
      // Section added to search (2026-08-31, Milan) - replaces the removed jump-to-section
      // nav row, which didn't scale (a per-product section set would need conditional
      // display logic that isn't worth building). Typing a section name (e.g. "Reports")
      // now surfaces its articles the same way typing a title or #id does.
      var titleEl = row.querySelector('.row-title');
      var idEl = row.querySelector('.row-id');
      var sectionEl = row.closest('.hc-section');
      var sectionName = sectionEl ? sectionEl.getAttribute('data-section') || '' : '';
      var text = ((titleEl ? titleEl.textContent : '') + ' ' + (idEl ? idEl.textContent : '') + ' ' + sectionName).toLowerCase();
      if (text.indexOf(q) === -1) return false;
    }
    return true;
  }

  function applyFilters() {
    document.getElementById('filters-btn-label').innerHTML = filtersButtonHtml();
    document.getElementById('applied-filters').innerHTML = appliedChipsHtml();

    // An honest gate (Type=Content alone, or Campaign=New Release alone) rebuilds
    // #main-content entirely (see buildMain) - when one's active there are no
    // .row elements to filter at all.
    document.getElementById('main-content').innerHTML = buildMain();
    if (gateMessage()) {
      document.getElementById('filter-count').textContent = '';
      return;
    }

    // Symmetric with every other dimension: no Product filter applied at all means
    // show both, same as "no Section filter" shows every section. DM only actually
    // hides once Product is explicitly narrowed to SM - found via testing that Reset
    // left DM hidden with a "showing 160 of 160" count that quietly excluded it,
    // which is exactly the kind of silently-wrong-count bug this project keeps re-finding.
    var includeSM = !appliedFilters.product.length || appliedFilters.product.indexOf('SM') !== -1;
    var includeDM = !appliedFilters.product.length || appliedFilters.product.indexOf('DM') !== -1;
    var sectionFilterActive = appliedFilters.section.length > 0;
    var campaignFilterActive = appliedFilters.campaign.length > 0;

    var allRows = Array.prototype.slice.call(document.querySelectorAll('.row[data-status]'));
    var visible = 0;
    allRows.forEach(function (row) {
      var sectionEl = row.closest('.hc-section');
      var sectionName = sectionEl ? sectionEl.getAttribute('data-section') : null;
      var sectionOk = !sectionName || !sectionFilterActive || appliedFilters.section.indexOf(sectionName) !== -1;
      var collection = row.getAttribute('data-collection');
      var scopeOk = collection === 'DM' ? includeDM : includeSM;
      var campaignOk = !campaignFilterActive || appliedFilters.campaign.indexOf(row.getAttribute('data-campaign')) !== -1;
      var show = sectionOk && scopeOk && campaignOk && rowMatches(row);
      row.classList.toggle('filter-hidden', !show);
      if (show) visible++;
    });
    document.querySelectorAll('.subsection').forEach(function (sub) {
      var anyVisible = Array.prototype.some.call(sub.querySelectorAll('.row'), function (r) { return !r.classList.contains('filter-hidden'); });
      sub.classList.toggle('filter-hidden', !anyVisible);
    });
    document.querySelectorAll('.hc-section').forEach(function (sec) {
      var anyVisible = Array.prototype.some.call(sec.querySelectorAll('.subsection'), function (s) { return !s.classList.contains('filter-hidden'); });
      sec.classList.toggle('filter-hidden', !anyVisible);
    });
    var countEl = document.getElementById('filter-count');
    var totalSelectable = allRows.filter(function (r) { return r.getAttribute('data-collection') === 'DM' ? includeDM : includeSM; }).length;
    if (countEl) countEl.textContent = 'showing ' + visible + ' of ' + totalSelectable + ' articles';
  }

  // Records a publish request live in the same Sheet the QA verdicts already
  // write to - a direct POST works here (no CSP issue, this page is plain
  // GitHub Pages, not a sandboxed claude.ai Artifact). This ONLY records the
  // request; it does not write Intercom or Notion itself - a static page can
  // hold no API credential to do that. Someone has to ask Claude to run the
  // publish queue (read every '__publish__ requested' row via ?mode=rows and
  // execute), same as the existing QA-sync-to-dashboard pattern. Later, that
  // ask can become a schedule instead of a person - the request/execute split
  // doesn't change either way.
  function requestPublish(articleId, articleTitle, btnEl) {
    if (!SYNC_ENDPOINT) { alert('Sync endpoint not configured - cannot record a publish request.'); return; }
    if (!articleId) return;
    var name = ensureReviewerName();
    if (!name) {
      btnEl.insertAdjacentHTML('afterend', '<span class="publish-error">Enter your name to publish</span>');
      return;
    }
    btnEl.disabled = true;
    btnEl.textContent = 'Requesting…';
    fetch(SYNC_ENDPOINT, {
      method: 'POST',
      // text/plain sidesteps a CORS preflight the same way the verdict POSTs
      // already do (see review-static-client.js) - Apps Script parses the
      // body as JSON regardless of the declared content type.
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify([{
        article_id: String(articleId), article: articleTitle || '',
        slot: '__publish__', shot_id: '__publish__',
        reviewer: name, verdict: 'requested', note: '',
      }]),
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data || !data.ok) throw new Error((data && data.error) || 'endpoint returned not-ok');
        publishRequested[articleId] = { state: 'requested', when: new Date().toISOString(), who: name };
        applyFilters(); // re-renders rows from current state, swaps this button for the badge
      })
      .catch(function (e) {
        btnEl.disabled = false;
        btnEl.textContent = 'Publish';
        btnEl.insertAdjacentHTML('afterend', '<span class="publish-error">Failed: ' + esc(e.message) + '</span>');
      });
  }

  // Records a Content QA vote, same wire shape and CORS workaround as requestPublish above -
  // one POST, upserts (article_id, '__content__', your cached name). Deliberately does not send
  // draft_url/stale_prose here: per review-sync.gs's own doPost, omitting those fields carries
  // forward whatever's already set for the article rather than blanking them, so a vote never
  // accidentally erases a draft link someone else (or a future drafting pass) set.
  function setContentVerdict(articleId, articleTitle, val, btnEl) {
    if (!SYNC_ENDPOINT) { alert('Sync endpoint not configured - cannot record a Content QA vote.'); return; }
    if (!articleId) return;
    var name = ensureReviewerName();
    if (!name) {
      btnEl.insertAdjacentHTML('afterend', '<span class="publish-error">Enter your name to vote</span>');
      return;
    }
    var group = btnEl.closest('.content-qa-actions');
    if (group) group.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    fetch(SYNC_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify([{
        article_id: String(articleId), article: articleTitle || '',
        slot: '__content__', shot_id: '__content__',
        reviewer: name, verdict: val, note: '',
      }]),
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data || !data.ok) throw new Error((data && data.error) || 'endpoint returned not-ok');
        if (!contentByArticle[articleId]) contentByArticle[articleId] = { verdict: '', draftUrl: '', staleProse: '', staleProseNote: '' };
        // Optimistic local update follows the same fail-wins rule as the real aggregation -
        // your own 'pass' can't downgrade an already-recorded 'fail' from another reviewer.
        if (val === 'fail' || contentByArticle[articleId].verdict !== 'fail') contentByArticle[articleId].verdict = val;
        applyFilters();
      })
      .catch(function (e) {
        if (group) group.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
        btnEl.insertAdjacentHTML('afterend', '<span class="publish-error">Failed: ' + esc(e.message) + '</span>');
      });
  }

  function setSyncStatus(text, isError) {
    var el = document.getElementById('sync-status');
    if (!el) return;
    el.textContent = text;
    el.classList.toggle('save-status-error', !!isError);
  }

  function render() {
    document.getElementById('headline').innerHTML = heroStatsHtml();
    var sidebarStats = document.getElementById('sidebar-stats');
    if (sidebarStats) sidebarStats.innerHTML = sidebarHtml();
    var list = document.getElementById('assignee-list');
    if (list) list.innerHTML = assigneeOptionsHtml();
    var assigneeSelect = document.getElementById('assignee-filter');
    if (assigneeSelect) {
      var current = assigneeSelect.value;
      assigneeSelect.innerHTML = '<option value="">Anyone</option><option value="__unassigned__">Unassigned</option>' + assigneeOptionsHtml();
      assigneeSelect.value = current;
    }
    wireModalControls();
    applyFilters();
  }

  // Fail-wins rollup: a shot with any reviewer's Fail counts as failed for
  // the hub tally even if another reviewer passed it - disagreement should
  // surface, not average away. Only rows for a shot_id that is genuinely a
  // due+shipped shot in this article count toward pass/fail (a verdict on a
  // frozen/non-due/legacy-only shot, if one ever exists, is ignored here -
  // same "one due population" rule the rest of this page follows).
  // Apps Script's exec endpoint occasionally answers a cold-start request with an
  // HTML redirect/interstitial instead of JSON (throws in r.json()) - purely
  // transient, gone on the next request a moment later. One retry after a short
  // delay absorbs that without a full page reload; only the second failure is
  // treated as a real outage.
  function fetchSyncRows(retriesLeft) {
    return fetch(SYNC_ENDPOINT + '?mode=rows')
      .then(function (r) { return r.json(); })
      .catch(function (e) {
        if (retriesLeft <= 0) throw e;
        return new Promise(function (resolve) { setTimeout(resolve, 1200); })
          .then(function () { return fetchSyncRows(retriesLeft - 1); });
      });
  }

  function loadSyncCounts() {
    if (!SYNC_ENDPOINT) { setSyncStatus('Sync not configured', true); render(); return; }
    fetchSyncRows(1)
      .then(function (data) {
        if (!data || !Array.isArray(data.rows)) {
          setSyncStatus('Sync endpoint not returning rows yet (old deployment?) — pass/fail counts show as 0 until it is redeployed', true);
          render();
          return;
        }
        var dueShotIdsByArticle = {};
        statusList.forEach(function (a) {
          if (!a.hasManifest) return;
          var ids = {};
          (a.shots || []).forEach(function (s) { if (s.dueForCapture && s.shipped) ids[s.id] = true; });
          dueShotIdsByArticle[a.id] = ids;
        });
        // Publish-request rows use the reserved slot '__publish__', which is never a
        // due shot id, so they'd be silently dropped by the due-shot filter below -
        // parsed here, first, in their own pass. UPDATE 2026-09-01: reviewer is now
        // the real cached name (was a fixed 'hub' sentinel), so more than one
        // '__publish__' row can exist per article - one per person who's ever
        // published/requested it. Explicitly keep the row with the latest
        // updated_at per article rather than trusting Sheet row order to already
        // be chronological, since a re-click by an EARLIER reviewer no longer
        // upserts in place ahead of a later reviewer's row the way the old
        // fixed-reviewer scheme guaranteed.
        var publishRowTime = {}; // article_id -> updated_at of the row currently kept
        data.rows.forEach(function (row) {
          var sid = String(row.shot_id || row.slot || '');
          if (sid !== '__publish__') return;
          var aid = String(row.article_id);
          if (row.verdict !== 'requested' && row.verdict !== 'published') return;
          var when = row.updated_at || '';
          if (publishRowTime[aid] && when && when < publishRowTime[aid]) return; // older than what we already kept
          publishRowTime[aid] = when;
          publishRequested[aid] = { state: row.verdict, when: when, who: row.reviewer || '' };
        });

        // Content-track rows, reserved slot '__content__' - see contentByArticle's own
        // declaration for the fuller design note. draft_url/stale_prose/stale_prose_note are
        // article-level in the Sheet (every row for an article carries the same value, per
        // review-sync.gs's own header comment), so any row for the article can supply them;
        // last one processed wins, which is fine since they should already agree. Verdict is
        // fail-wins across every '__content__' row for the article, same rule as Shot QA.
        data.rows.forEach(function (row) {
          var sid = String(row.shot_id || row.slot || '');
          if (sid !== '__content__') return;
          var aid = String(row.article_id);
          if (!contentByArticle[aid]) contentByArticle[aid] = { verdict: '', draftUrl: '', staleProse: '', staleProseNote: '' };
          var c = contentByArticle[aid];
          if (row.verdict === 'fail') c.verdict = 'fail';
          else if (row.verdict === 'pass' && c.verdict !== 'fail') c.verdict = 'pass';
          if (row.draft_url) c.draftUrl = row.draft_url;
          if (row.stale_prose) c.staleProse = row.stale_prose;
          if (row.stale_prose_note) c.staleProseNote = row.stale_prose_note;
        });

        var byArticleShot = {}; // article_id -> shot_id -> verdict[]
        data.rows.forEach(function (row) {
          var aid = String(row.article_id);
          var sid = String(row.shot_id || row.slot);
          var dueIds = dueShotIdsByArticle[aid];
          if (!dueIds || !dueIds[sid]) return; // ignore verdicts on non-due/unknown shots
          if (!byArticleShot[aid]) byArticleShot[aid] = {};
          if (!byArticleShot[aid][sid]) byArticleShot[aid][sid] = [];
          byArticleShot[aid][sid].push(row.verdict);
        });
        Object.keys(byArticleShot).forEach(function (aid) {
          var pass = 0, fail = 0;
          Object.keys(byArticleShot[aid]).forEach(function (sid) {
            var verdicts = byArticleShot[aid][sid];
            if (verdicts.indexOf('fail') !== -1) fail++;
            else if (verdicts.indexOf('pass') !== -1) pass++;
          });
          syncCounts[aid] = { pass: pass, fail: fail };
        });
        syncLoaded = true;
        setSyncStatus('Synced ' + data.rows.length + ' review rows', false);
        setTimeout(function () { setSyncStatus('', false); }, 3000);
        render();
      })
      .catch(function (e) {
        setSyncStatus('Sync fetch failed (' + e.message + ') — pass/fail counts show as 0', true);
        render();
      });
  }

  restoreFilterState();
  render();
  loadSyncCounts();
})();
</script>
